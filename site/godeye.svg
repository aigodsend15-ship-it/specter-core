<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">GodEye observability plane</title><desc id="d">Abstract cybernetic eye showing telemetry, receipts and agent health flowing into Specter Core</desc><defs><radialGradient id="bg" cx="50%" cy="50%" r="70%"><stop stop-color="#10224d"/><stop offset=".42" stop-color="#070d1b"/><stop offset="1" stop-color="#02050a"/></radialGradient><radialGradient id="iris"><stop stop-color="#d7fbff"/><stop offset=".15" stop-color="#75e7ff"/><stop offset=".45" stop-color="#6f77ff"/><stop offset=".72" stop-color="#a06cff"/><stop offset="1" stop-color="#091022"/></radialGradient><linearGradient id="line" x1="0" x2="1"><stop stop-color="#65e5ff"/><stop offset=".5" stop-color="#7c79ff"/><stop offset="1" stop-color="#b5ff73"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7da0ff" stroke-opacity=".08"/></pattern></defs><rect width="1200" height="720" rx="36" fill="url(#bg)"/><rect width="1200" height="720" rx="36" fill="url(#grid)"/><g opacity=".75"><path d="M110 360C260 130 410 120 600 360 790 120 940 130 1090 360 940 590 790 600 600 360 410 600 260 590 110 360Z" fill="#081126" stroke="url(#line)" stroke-width="3"/><path d="M155 360C300 190 430 185 600 360 770 185 900 190 1045 360 900 530 770 535 600 360 430 535 300 530 155 360Z" fill="none" stroke="#6fdfff" stroke-opacity=".28"/></g><g transform="translate(600 360)" filter="url(#glow)"><circle r="180" fill="#06101f" stroke="#6074ff" stroke-width="3"/><circle r="146" fill="url(#iris)"/><circle r="92" fill="#050913" stroke="#7ee8ff" stroke-width="3"/><circle r="38" fill="#000"/><circle cx="-34" cy="-42" r="16" fill="#fff" opacity=".68"/><g fill="none" stroke="#a5f4ff" stroke-width="2" opacity=".5"><circle r="118" stroke-dasharray="10 16"/><circle r="164" stroke-dasharray="3 18"/></g><g stroke="#a88cff" opacity=".45"><path d="M-150 0H150M0-150V150"/><path d="M-106-106 106 106M106-106-106 106"/></g></g><g font-family="Inter,Segoe UI,Arial,sans-serif"><g fill="#c7d2e8" font-size="18" font-weight="600"><text x="92" y="118">TELEMETRY</text><text x="912" y="118">MODEL HEALTH</text><text x="92" y="628">RECEIPTS</text><text x="914" y="628">POLICY GATES</text></g><g fill="#7f93b8" font-size="14"><text x="92" y="145">latency · uptime · queue</text><text x="912" y="145">capacity · throttle · failover</text><text x="92" y="655">hash · replay · evidence</text><text x="914" y="655">scope · identity · approval</text></g></g><g fill="none" stroke="url(#line)" stroke-width="2" opacity=".7"><path d="M240 150C365 170 410 240 468 292"/><path d="M960 150C835 170 790 240 732 292"/><path d="M240 570C365 550 410 480 468 428"/><path d="M960 570C835 550 790 480 732 428"/></g><g fill="#b5ff73"><circle cx="240" cy="150" r="5"/><circle cx="960" cy="150" r="5"/><circle cx="240" cy="570" r="5"/><circle cx="960" cy="570" r="5"/></g><text x="600" y="688" text-anchor="middle" fill="#8292ad" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="4">GODEYE // OBSERVABILITY PLANE</text></svg>