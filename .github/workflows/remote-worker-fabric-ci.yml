name: Remote Worker Fabric CI

on:
  push:
    branches:
      - specter/remote-worker-fabric-v1
  pull_request:
    paths:
      - 'Core/remote_worker_fabric.py'
      - 'Core/test_remote_worker_fabric.py'
      - '.github/workflows/remote-worker-fabric-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile Core/remote_worker_fabric.py Core/test_remote_worker_fabric.py
      - name: Unit tests
        run: python Core/test_remote_worker_fabric.py
