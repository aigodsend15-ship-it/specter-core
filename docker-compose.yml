version: '3.8'

services:
  specter-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: specter-inference-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - specter-storage:/app/storage
    environment:
      - SPECTER_PORT=8080
      - SPECTER_HOST=0.0.0.0
      - SPECTER_ZERO_COST_INVARIANT=1
    command: ["--host", "0.0.0.0", "--port", "8080"]

  specter-supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: specter-supervisor-mesh
    restart: unless-stopped
    volumes:
      - specter-storage:/app/storage
    entrypoint: ["python", "-m", "Core.specter_supervisor_247"]

volumes:
  specter-storage:
    driver: local
